<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
<title id="t">JWT Playground architecture</title>
<desc id="d">A static host delivers the page once. Inside the browser, React components talk to a state hook and reducer, which call pure JWT logic, which calls the Web Crypto API. Servers and storage are blocked: nothing leaves the browser.</desc>
<style>
 text{font-family:'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
 .ink{fill:#17241e} .mut{fill:#586c61} .wh{fill:#fff} .lt{fill:#dbe9da}
 .h{font-weight:600}
 .band{fill:#f6f8f6} .chip{fill:#fff} .dark{fill:#1b2c22}
 .down{stroke:#17241e} .up{stroke:#267452}
 .flow{fill:none;stroke-width:2.5;stroke-dasharray:5 7;animation:flow 1.1s linear infinite}
 .arrow-d{fill:#17241e} .arrow-u{fill:#267452}
 .x{stroke:#b4232c;stroke-width:3.5;stroke-linecap:round}
 .rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
 .beat{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}
 @keyframes flow{to{stroke-dashoffset:-12}}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 @keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
 @media (prefers-reduced-motion:reduce){.flow,.rise,.beat{animation:none;opacity:1}}
</style>
<defs>
 <marker id="ad" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#17241e"/></marker>
 <marker id="au" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#267452"/></marker>
</defs>
<rect width="1200" height="800" rx="22" fill="#eef1ef"/>

<g class="rise" style="--d:0s"><text x="48" y="64" class="ink h" font-size="30" letter-spacing="-0.8">How JWT Playground fits together</text>
<text x="48" y="92" class="mut" font-size="15">Your token and keys are processed in the browser. The server only delivers the page.</text></g>
<rect x="1062" y="38" width="22" height="46" rx="4" fill="#b13959" class="beat" style="animation-delay:0.0s" transform="skewX(-12)"/>
<rect x="1092" y="38" width="22" height="46" rx="4" fill="#916000" class="beat" style="animation-delay:0.3s" transform="skewX(-12)"/>
<rect x="1122" y="38" width="22" height="46" rx="4" fill="#176f85" class="beat" style="animation-delay:0.6s" transform="skewX(-12)"/>
<g class="rise" style="--d:.1s"><rect x="28" y="270" width="162" height="140" rx="14" class="dark"/>
<text x="48" y="306" class="wh h" font-size="17">Static host</text><text x="48" y="328" class="lt" font-size="13">Vercel</text>
<text x="48" y="360" class="lt" font-size="13">index.html, JS, fonts</text><text x="48" y="380" class="lt" font-size="13">and security headers</text></g>
<path class="flow down" d="M190 340 H262" marker-end="url(#ad)"/>
<text x="226" y="326" class="mut" font-size="12.5" text-anchor="middle">loaded once</text>
<g class="rise" style="--d:.15s"><rect x="270" y="112" width="730" height="652" rx="18" fill="#dbe9da"/>
<text x="294" y="144" class="ink h" font-size="17">Your browser</text>
<text x="408" y="144" class="mut" font-size="14">everything inside this box runs on your device</text></g>
<g class="rise" style="--d:.25s"><rect x="294" y="160" width="682" height="146" rx="12" class="band"/>
<text x="318" y="190" class="ink h" font-size="15">Interface</text><text x="402" y="190" class="mut" font-size="13">React components</text>
<rect x="318" y="208" width="148" height="36" rx="8" class="chip"/><text x="332" y="231" class="ink h" font-size="13.5">App.jsx</text>
<rect x="480" y="208" width="148" height="36" rx="8" class="chip"/><text x="494" y="231" class="ink h" font-size="13.5">TokenField</text>
<rect x="642" y="208" width="148" height="36" rx="8" class="chip"/><text x="656" y="231" class="ink h" font-size="13.5">JsonField</text>
<rect x="804" y="208" width="148" height="36" rx="8" class="chip"/><text x="818" y="231" class="ink h" font-size="13.5">KeyPanel</text>
<rect x="318" y="254" width="148" height="36" rx="8" class="chip"/><text x="332" y="277" class="ink h" font-size="13.5">ClaimsPanel</text>
<rect x="480" y="254" width="148" height="36" rx="8" class="chip"/><text x="494" y="277" class="ink h" font-size="13.5">Tabs</text>
<rect x="642" y="254" width="148" height="36" rx="8" class="chip"/><text x="656" y="277" class="ink h" font-size="13.5">SegmentChips</text>
<rect x="804" y="254" width="148" height="36" rx="8" class="chip"/><text x="818" y="277" class="ink h" font-size="13.5">CopyButton</text>
</g>
<g class="rise" style="--d:.4s"><rect x="294" y="344" width="682" height="116" rx="12" class="band"/>
<text x="318" y="374" class="ink h" font-size="15">State</text><text x="368" y="374" class="mut" font-size="13">one hook, one reducer</text>
<rect x="318" y="392" width="148" height="56" rx="8" class="chip"/><text x="332" y="415" class="ink h" font-size="13.5">useJwt.js</text><text x="332" y="434" class="mut" font-size="12">async verify, sign</text>
<rect x="480" y="392" width="148" height="56" rx="8" class="chip"/><text x="494" y="415" class="ink h" font-size="13.5">jwtState.js</text><text x="494" y="434" class="mut" font-size="12">drafts and revisions</text>
<rect x="642" y="392" width="148" height="56" rx="8" class="chip"/><text x="656" y="415" class="ink h" font-size="13.5">useNow.js</text><text x="656" y="434" class="mut" font-size="12">clock for time flags</text>
<rect x="804" y="392" width="148" height="56" rx="8" class="chip"/><text x="818" y="415" class="ink h" font-size="13.5">status.js</text><text x="818" y="434" class="mut" font-size="12">results into words</text>
</g>
<g class="rise" style="--d:.55s"><rect x="294" y="498" width="682" height="132" rx="12" class="band"/>
<text x="318" y="528" class="ink h" font-size="15">Pure logic</text><text x="406" y="528" class="mut" font-size="13">no React, no DOM</text>
<rect x="318" y="544" width="114" height="72" rx="8" class="chip"/><text x="330" y="566" class="ink h" font-size="13.5">jwt.js</text>
<text x="330" y="586" class="mut" font-size="12">decode, verify,</text>
<text x="330" y="603" class="mut" font-size="12">sign, claims</text>
<rect x="448" y="544" width="114" height="72" rx="8" class="chip"/><text x="460" y="566" class="ink h" font-size="13.5">keys.js</text>
<text x="460" y="586" class="mut" font-size="12">algorithm list,</text>
<text x="460" y="603" class="mut" font-size="12">key import</text>
<rect x="578" y="544" width="114" height="72" rx="8" class="chip"/><text x="590" y="566" class="ink h" font-size="13.5">der.js</text>
<text x="590" y="586" class="mut" font-size="12">re-wraps PKCS#1</text>
<text x="590" y="603" class="mut" font-size="12">and SEC1 keys</text>
<rect x="708" y="544" width="114" height="72" rx="8" class="chip"/><text x="720" y="566" class="ink h" font-size="13.5">base64url.js</text>
<text x="720" y="586" class="mut" font-size="12">unpadded,</text>
<text x="720" y="603" class="mut" font-size="12">UTF-8 safe</text>
<rect x="838" y="544" width="114" height="72" rx="8" class="chip"/><text x="850" y="566" class="ink h" font-size="13.5">jwtErrors.js</text>
<text x="850" y="586" class="mut" font-size="12">typed error</text>
<text x="850" y="603" class="mut" font-size="12">codes</text>
</g>
<g class="rise" style="--d:.7s"><rect x="294" y="676" width="682" height="64" rx="12" class="dark"/>
<text x="318" y="704" class="wh h" font-size="16">Web Crypto API</text>
<text x="318" y="725" class="lt" font-size="13">HMAC, RSA, RSA-PSS, ECDSA and Ed25519, built into the browser. No crypto library.</text></g>
<path class="flow down" d="M520 309 V341" marker-end="url(#ad)"/>
<text x="532" y="329" class="ink" font-size="12.5">what you type</text>
<path class="flow up" d="M640 341 V309" marker-end="url(#au)"/>
<text x="652" y="329" fill="#267452" font-size="12.5" font-weight="600">what you see</text>
<path class="flow down" d="M520 463 V495" marker-end="url(#ad)"/>
<text x="532" y="483" class="ink" font-size="12.5">token and key</text>
<path class="flow up" d="M640 495 V463" marker-end="url(#au)"/>
<text x="652" y="483" fill="#267452" font-size="12.5" font-weight="600">typed results</text>
<path class="flow down" d="M520 633 V673" marker-end="url(#ad)"/>
<text x="532" y="657" class="ink" font-size="12.5">bytes to sign</text>
<path class="flow up" d="M640 673 V633" marker-end="url(#au)"/>
<text x="652" y="657" fill="#267452" font-size="12.5" font-weight="600">signature or yes/no</text>
<g class="rise" style="--d:.8s">
<rect x="1030" y="210" width="140" height="84" rx="14" fill="#e3e8e5"/><text x="1050" y="246" class="ink h" font-size="16">Servers</text><text x="1050" y="268" class="mut" font-size="13">receive nothing</text>
<path d="M1000 252 H1030" stroke="#8a9a92" stroke-width="2.5" stroke-dasharray="3 5"/>
<g class="beat"><path class="x" d="M1009 245 L1021 259 M1021 245 L1009 259"/></g>
<rect x="1030" y="330" width="140" height="84" rx="14" fill="#e3e8e5"/><text x="1050" y="366" class="ink h" font-size="16">Storage</text><text x="1050" y="388" class="mut" font-size="13">saves nothing</text>
<path d="M1000 372 H1030" stroke="#8a9a92" stroke-width="2.5" stroke-dasharray="3 5"/>
<g class="beat"><path class="x" d="M1009 365 L1021 379 M1021 365 L1009 379"/></g>
<text x="1030" y="450" class="mut" font-size="12.5">Blocked by the CSP:</text><text x="1030" y="468" class="ink h" font-size="12.5">connect-src 'none'</text>
<text x="1030" y="492" class="mut" font-size="12.5">and nothing is written</text><text x="1030" y="510" class="mut" font-size="12.5">to browser storage.</text></g>
<text x="48" y="788" class="mut" font-size="13">Dark arrows carry what you type down. Green arrows carry results back up.</text>
</svg>